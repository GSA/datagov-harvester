server {
    listen 80;

    # Mirrors proxy/nginx-common.conf's validator routing for local/CI use
    # (that file is cloud.gov-buildpack-templated and shouldn't be run as-is
    # outside a deploy): send validate API calls to the validator container,
    # everything else to the Flask dev server.
    location ~ ^/api(/v1)?/validate$ {
        proxy_pass http://validator:8080;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
