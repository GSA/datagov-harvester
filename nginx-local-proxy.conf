server {
    listen 80;

    # Mirrors proxy/nginx.conf and proxy/nginx-common.conf for local/CI use
    # (those are cloud.gov-buildpack-templated and can't run as-is outside a
    # deploy): validate API calls go to the validator container, everything
    # else to the Flask dev server, with the same body-size limits.
    client_max_body_size 12M;

    location ~ ^/api(/v1)?/validate$ {
        client_max_body_size 21M;
        proxy_read_timeout 110s;
        proxy_pass http://validator:8080;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
