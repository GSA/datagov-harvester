worker_processes 2;
daemon off;

error_log stderr;

http {
  map_hash_bucket_size 128;
  server_names_hash_bucket_size 128;
  charset utf-8;
  log_format cloudfoundry 'NginxLog "$request" $status $body_bytes_sent';
  access_log /dev/stdout cloudfoundry;
  default_type application/octet-stream;
  include mime.types;
  sendfile on;

  tcp_nopush on;
  keepalive_timeout 30;
  port_in_redirect off; # Ensure that redirects don't include the internal container PORT - 8080

  resolver {{nameservers}} valid=10s ipv6=off;

  include nginx-maps.conf;

  server {
    listen {{port}};
    root public;
    index index.html index.htm Default.htm;
  }

  server {
    server_name {{env "EXTERNAL_ROUTE"}};

    set $auth_enabled    {{env "BASIC_AUTH_ENABLED"}};
    auth_basic           $apply_auth;
    auth_basic_user_file /home/vcap/app/.htpasswd;

    # The app owns the limit (MAX_CONTENT_LENGTH, 10M) so it can answer readably.
    # Multipart overhead puts a 10M file just over 10M, so matching the app's limit
    # here made nginx reject it first with its bare 413. 2M of headroom lets the app
    # answer; past 12M nginx rejects outright. Cost: request buffering is on, so a
    # body in the 10-12M band is read in full before the app refuses it.
    client_max_body_size 12M;

    include nginx-malicious.conf;
    include nginx-common.conf;
    include nginx-maintenance.conf;
  }
}

user nobody nogroup;
# 'user nobody nobody;' for systems with 'nobody' as a group instead
# cloud.gov does not like the 'pid' param
# pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  accept_mutex off;
}
