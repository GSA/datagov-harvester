# block malicious requests detected by AWS WAF
# https://github.com/GSA/data.gov/issues/5236

# return 429 for any non-empty X-Amzn-Waf-Detection header value
if ($waf_block) {
  return 429;
}

# A URI error_page turns a POST into a GET for the block page. The named
# location used before kept the POST, and nginx answers a POST for a static
# file with 405, so blocked POSTs got a 405 (GSA/data.gov#6513).
error_page 429 $waf_block_page;

location = /malicious.html {
  root ./public;
}
location = /malicious.json {
  root ./public;
}
