# talk to the right internal app
map $server_name $internal_url {
  default {{env "INTERNAL_ROUTE"}};
}

# Cloud.gov appends proxy hops to X-Forwarded-For. Only the first address is
# considered here. The networks themselves are maintained in the CIDR list.
map $http_x_forwarded_for $client_ip {
  default "";
  ~^\s*(?<first_client_ip>[^,\s]+) $first_client_ip;
}

geo $client_ip $allowlisted_client_ip {
  default 0;
  include ip-allow-list.conf;
}

map "$auth_enabled:$allowlisted_client_ip" $apply_auth_for_client {
  default     on;
  "false:0"   off;
  "false:1"   off;
  "true:0"    on;
  "true:1"    off;
}
