# talk to the right internal app
map $server_name $internal_url {
  default {{env "INTERNAL_ROUTE"}};
}

# GSA/data.gov#6293: validator paths are proxied to their own internal app
map $server_name $validator_internal_url {
  default {{env "VALIDATOR_INTERNAL_ROUTE"}};
}

# Cloud.gov appends proxy hops to X-Forwarded-For. Only the first address is
# considered here. The networks themselves are maintained in the CIDR list.
map $http_x_forwarded_for $client_ip {
  default "";
  ~^\s*(?<first_client_ip>[^,\s]+) $first_client_ip;
}

geo $client_ip $allowlisted_client_ip {
  default 0;
  include ip-allow-list.conf;
}

map "$auth_enabled:$allowlisted_client_ip" $apply_auth_for_client {
  default     on;
  "false:0"   off;
  "false:1"   off;
  "true:0"    on;
  "true:1"    off;
}

# GSA/data.gov#6513: any WAF detection blocks the request, except the block
# page itself, because the error_page redirect to it re-runs that check
map "$http_x_amzn_waf_detection:$uri" $waf_block {
  # re-evaluated after the redirect, not cached from the first check
  volatile;
  default                              1;
  "~^:"                                0;
  "~^[^:]*:/malicious\.(html|json)$"  0;
}

# API callers get the WAF block as JSON, browsers the page
map $uri $waf_block_page {
  default  /malicious.html;
  ~^/api/  /malicious.json;
}

# The longest WAF rate-limit window is 5 minutes
map $http_x_amzn_waf_detection $waf_retry_after {
  default    "";
  ratelimit  300;
}
