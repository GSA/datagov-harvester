# use 'listen 80 deferred;' for Linux
# use 'listen 80 accept_filter=httpready;' for FreeBSD
listen {{port}};

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

keepalive_timeout 5;

# path for static files
root ./public;

# simplify redirect with relative path
absolute_redirect off;

# GSA/data.gov#6293: the validate API runs in its own minimal app
# (validator_api/, datagov-harvest-validator), for capacity and security
# isolation from admin. External callers use it, and so does the /validate/
# page, which the admin app only renders - the browser fetch()es this path
# (app/static/js/view_validators.js). The admin app has no such routes, so this
# block is required, not a rollback switch.
location ~ ^/api(/v1)?/validate(/document)?$ {
  # /validate takes a document of up to 150M (MAX_UPLOAD_MB) JSON-escaped inside
  # json_text, which makes it ~10-25% bigger; the validator accepts 225M bodies
  # for that and answers anything larger with its own JSON 413. 1M of headroom
  # above that lets it answer rather than nginx's bare HTML 413.
  # /validate/document (what the page sends) takes the document itself.
  client_max_body_size 226M;
  set $internal_url $validator_internal_url;
  try_files $uri @proxy_to_validator;
}

# The validator's own OpenAPI docs, linked from the admin app's /openapi/docs,
# and its health check, for uptime monitoring through the public route.
location ~ ^/validator/(docs|openapi\.json|health)$ {
  set $internal_url $validator_internal_url;
  try_files $uri @proxy_to_app;
}

location / {
  # checks for static file, if not found proxy to app
  try_files $uri @proxy_to_app;
}

location @proxy_to_app {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Strict-Transport-Security;
  proxy_redirect off;

  # Explicit rather than nginx's 60s default, so a slow validation isn't cut off.
  # Validation takes ~2s even at the 150M cap (GSA/data.gov#6460), so a
  # submission isn't cut off here. gunicorn's --timeout 120 is
  # only a gthread liveness check, not a request deadline, so nginx always ends a
  # slow request - verified, with the 504 handled below. CloudFront and the CF
  # router sit in front with their own idle timeouts, so this is nginx's ceiling,
  # not the request's.
  proxy_read_timeout 110s;

  set $backend_servers $internal_url:61443;
  proxy_pass https://${backend_servers}${request_uri};
}

# @proxy_to_app, but with the validator's own JSON answers passed through:
# with proxy_intercept_errors on, its 503 "busy, try again" (and its 500) were
# swapped for nginx's maintenance or error page, which nginx then refused to
# serve for a POST, so callers got a 405 (GSA/data.gov#6460).
location @proxy_to_validator {
  proxy_intercept_errors off;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Strict-Transport-Security;
  proxy_redirect off;
  proxy_read_timeout 110s;

  set $backend_servers $internal_url:61443;
  proxy_pass https://${backend_servers}${request_uri};
}

proxy_intercept_errors on;
error_page 500 502 504 /500.html;
location = /500.html {
  root ./public;
}

error_page 403 /403.html;
location = /403.html {
  root ./public;
}

# Deliberately no `error_page 413`: with proxy_intercept_errors on it would also
# replace the apps' own 413 - verified, it swaps /api/v1/validate's JSON for HTML.
# Scoping one to the HTML locations would spare /api/, but it would shadow the
# app's 413.html and duplicate the limit text here. Not worth it while the apps
# answer oversized submissions themselves: each location's client_max_body_size
# sits above its app's own limit, and the /validate/ page maps a bare 413 to a
# "too large" message (app/static/js/view_validators.js).

# Don't leak any server information in response headers
server_tokens off;
