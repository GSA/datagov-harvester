# use 'listen 80 deferred;' for Linux
# use 'listen 80 accept_filter=httpready;' for FreeBSD
listen {{port}};

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

keepalive_timeout 5;

# path for static files
root ./public;

# simplify redirect with relative path
absolute_redirect off;

location / {
  # checks for static file, if not found proxy to app
  try_files $uri @proxy_to_app;
}

location @proxy_to_app {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Strict-Transport-Security;
  proxy_redirect off;

  # Explicit rather than nginx's 60s default, so a slow validation (~8s worst
  # measured) isn't cut off. gunicorn's --timeout 120 is only a gthread liveness
  # check, not a request deadline, so nginx always ends a slow request - verified,
  # with the 504 handled below.
  proxy_read_timeout 110s;

  set $backend_servers $internal_url:61443;
  proxy_pass https://${backend_servers}${request_uri};
}

proxy_intercept_errors on;
error_page 500 502 504 /500.html;
location = /500.html {
  root ./public;
}

error_page 403 /403.html;
location = /403.html {
  root ./public;
}

# Deliberately no `error_page 413`: with proxy_intercept_errors on it would also
# replace the app's own 413 - verified, it swaps /api/v1/validate's JSON for HTML.
# The app answers oversized submissions itself; only bodies over
# client_max_body_size get nginx's default 413.

# Don't leak any server information in response headers
server_tokens off;
