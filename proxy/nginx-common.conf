# use 'listen 80 deferred;' for Linux
# use 'listen 80 accept_filter=httpready;' for FreeBSD
listen {{port}};

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

keepalive_timeout 5;

# path for static files
root ./public;

# simplify redirect with relative path
absolute_redirect off;

location / {
  # checks for static file, if not found proxy to app
  try_files $uri @proxy_to_app;
}

location @proxy_to_app {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Strict-Transport-Security;
  proxy_redirect off;

  # Explicit rather than nginx's 60s default, and below gunicorn's --timeout 120
  # (app-start.sh) so nginx decides when a slow request is over. Otherwise the
  # gunicorn arbiter kills the worker first and the torn-down connection reaches
  # the user as a 502 instead of the 504 handled below. (GSA/data.gov#6067)
  proxy_read_timeout 110s;

  set $backend_servers $internal_url:61443;
  proxy_pass https://${backend_servers}${request_uri};
}

proxy_intercept_errors on;
error_page 500 502 504 /500.html;
location = /500.html {
  root ./public;
}

error_page 403 /403.html;
location = /403.html {
  root ./public;
}

# Deliberately no `error_page 413`. With proxy_intercept_errors on, an error_page
# for a status also replaces the app's own response with that status - verified,
# it swaps the JSON body /api/v1/validate returns for a 413 with an HTML page.
# The app answers oversized submissions itself (app/templates/413.html for
# browsers, JSON for /api/), and client_max_body_size leaves it the room to do
# so. Only bodies over that limit get nginx's default 413. (GSA/data.gov#6067)

# Don't leak any server information in response headers
server_tokens off;
