name: Check DB schema drift

on:
  schedule:
    - cron: "0 9 * * *" # 5am EDT
  workflow_dispatch:
    inputs:
      environment:
        description: "environment to use"
        required: true
        default: "development"
        type: choice
        options:
          - prod
          - staging
          - development

permissions:
  contents: read
  issues: write

jobs:
  determine-environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-env.outputs.environments }}
    steps:
      - id: set-env
        env:
          SELECTED_ENV: ${{ inputs.environment || 'development' }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo 'environments=["staging","prod"]' >> "$GITHUB_OUTPUT"
          else
            echo "environments=[\"$SELECTED_ENV\"]" >> "$GITHUB_OUTPUT"
          fi

  check-db-schema:
    needs: determine-environments
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJson(needs.determine-environments.outputs.environments) }}
    environment: ${{ matrix.environment }}
    env:
      CF_SPACE: ${{ matrix.environment }}
      TASK_COMMAND: flask db check
    steps:
      - uses: actions/checkout@v7

      - name: Store task instance name
        run: |
          echo "DB_SCHEMA_CHECK_INSTANCE_NAME=db-schema-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: run task
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: >
            cf run-task datagov-harvest
            --name "$DB_SCHEMA_CHECK_INSTANCE_NAME"
            --command "$TASK_COMMAND" -m 1G
          cf_org: gsa-datagov
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{secrets.CF_SERVICE_USER}}
          cf_password: ${{secrets.CF_SERVICE_AUTH}}

      - name: monitor task output
        timeout-minutes: 10
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: >
            bin/monitor_cf_logs.sh datagov-harvest "$DB_SCHEMA_CHECK_INSTANCE_NAME"
          cf_org: gsa-datagov
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{secrets.CF_SERVICE_USER}}
          cf_password: ${{secrets.CF_SERVICE_AUTH}}

      - name: Create Issue for schema drift
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_ATTEMPTS: ${{ github.run_attempt }}
          LAST_COMMIT: ${{ github.sha }}
          LAST_RUN_BY: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          COMMAND: ${{ env.TASK_COMMAND }}
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          filename: .github/db_schema_drift.md
          update_existing: true
