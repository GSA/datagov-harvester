name: 2 - Deploy
on:
  push:
    branches:
      - main

# default minimal permissions for every job
permissions:
    contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  detect-opensearch-migration:
    name: Detect OpenSearch migration
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-opensearch-migration.yml

  release-staging:
    name: Release staging
    needs: detect-opensearch-migration
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-space.yml
    with:
      space: staging
      migrate_opensearch: ${{ needs.detect-opensearch-migration.outputs.migration_needed == 'true' }}
      migration_prs: ${{ needs.detect-opensearch-migration.outputs.pr_numbers }}
    secrets: inherit

  release-prod:
    name: Release production
    needs:
      - detect-opensearch-migration
      - release-staging
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-space.yml
    with:
      space: prod
      migrate_opensearch: ${{ needs.detect-opensearch-migration.outputs.migration_needed == 'true' }}
      migration_prs: ${{ needs.detect-opensearch-migration.outputs.pr_numbers }}
    secrets: inherit

  disable-on-release-failure:
    name: Disable automatic deployments
    needs:
      - detect-opensearch-migration
      - release-staging
      - release-prod
    if: >-
      ${{ always()
      && (needs.detect-opensearch-migration.result == 'failure'
      || needs.release-staging.result == 'failure'
      || needs.release-prod.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disable deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable deploy.yml --repo "$GITHUB_REPOSITORY"
          {
            echo "### Automatic deployments disabled"
            echo
            echo "A release job failed, so \`deploy.yml\` will not run on later merges."
            echo "After investigating the failed release, re-enable it with:"
            echo
            echo "\`gh workflow enable deploy.yml --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
