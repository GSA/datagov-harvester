name: 2 - Deploy

# Deploy to staging then prod, rebuilding the OpenSearch index in each space when a
# merged PR asked for it.
#
#   detect the "force re-index recommended" label across this push
#     -> refuse early if a replacement cluster is already lying around
#     -> staging: create services, push, WAIT for the rollout, then reindex
#     -> prod:    same, only after staging finished completely
#     -> network policies
#
# THE WHOLE RUN IS ONE QUEUED UNIT. A second merge waits for all of it -- both
# deploys and both reindexes -- rather than pushing into a space mid-migration. See
# the concurrency block below.
#
# See docs/ops/migrate-opensearch-cluster.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_no:
        description: "Release Version:"
        required: true
      reindex:
        description: "auto = detect the label; force = reindex regardless; skip = deploy only"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - force
          - skip
      dry_run:
        description: "Print the reindex inputs instead of running it (no cluster is touched)"
        required: false
        default: false
        type: boolean

# default minimal permissions for every job
permissions:
  contents: read

# ONE queue for the entire release, deliberately NOT per-environment: a single run
# spans staging and prod, so the run *is* the unit. A second merge queues behind all
# of it.
#
# `cancel-in-progress: false` because a run may be mid-promote -- cancelling between
# the two `cf rename-service` calls would leave the canonical name unresolvable and
# every new container start failing .profile's empty-host guard.
#
# Note the default `queue: single`: only one run can be pending, and a third merge
# CANCELS the pending one. That is right for deploys (you want the newest code) but
# it would drop a reindex obligation, which is why detect-reindex measures from the
# last *successful* run rather than from this push's own range.
#
# CRITICAL: this must never be `opensearch-maintenance-*`. The reindex-* jobs call
# migrate_opensearch_cluster.yml, which takes that group at its own workflow level; a
# workflow-level hold here would make the child queue behind its own parent forever.
# The same trap is documented at migrate_opensearch_cluster.yml:190-194. Individual
# jobs below take the maintenance group at JOB level instead, which releases it
# before the child needs it.
#
# That release behaviour is not stated in GitHub's docs, so it was measured rather
# than assumed: a throwaway workflow held a group on one job, then called a reusable
# workflow whose own workflow-level group was the same name. The child acquired it and
# the run completed (2026-08-11). If that ever regresses the symptom is a run stuck in
# "Queued" forever, and the fix is to drop the per-job groups and rely on
# deploy-main-pipeline alone.
concurrency:
  group: deploy-main-pipeline
  cancel-in-progress: false

env:
  PY_VERSION: "3.12.13"
  POETRY_VERSION: "latest"

jobs:
  # --- decide whether this push owes a reindex -------------------------------
  detect-reindex:
    name: Detect reindex label
    runs-on: ubuntu-latest
    permissions:
      contents: read # compare
      pull-requests: read # commits/<sha>/pulls
      actions: read # the watermark, from this workflow's own runs
    outputs:
      reindex_needed: ${{ steps.detect.outputs.reindex_needed }}
      pr_numbers: ${{ steps.detect.outputs.pr_numbers }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Detect the reindex label
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REINDEX_MODE: ${{ inputs.reindex || 'auto' }}
        run: |
          case "$REINDEX_MODE" in
            force)
              echo "::notice::reindex=force: rebuilding regardless of labels."
              {
                echo "reindex_needed=true"
                echo "pr_numbers=manual"
                echo "base_sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              ;;
            skip)
              echo "::notice::reindex=skip: deploying without a rebuild."
              {
                echo "reindex_needed=false"
                echo "pr_numbers="
                echo "base_sha=${GITHUB_SHA}"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              .github/scripts/detect-reindex-label.sh "$GITHUB_SHA"
              ;;
          esac

      - name: Summarize
        env:
          NEEDED: ${{ steps.detect.outputs.reindex_needed }}
          PRS: ${{ steps.detect.outputs.pr_numbers }}
        run: |
          if [[ "$NEEDED" == "true" ]]; then
            {
              echo "### OpenSearch reindex required"
              echo
              echo "PR(s) \`${PRS}\` carry \`force re-index recommended\`, so the"
              echo "\`datasets\` index will be rebuilt in staging and then prod after each"
              echo "deploy. Search keeps serving throughout; only the promote moves traffic."
              echo
              echo "**Confirm \`GSA/datagov-catalog\` already has the matching schema"
              echo "deployed.** The harvester writes the new document shape; if catalog is"
              echo "still reading the old one the mismatch is SILENT -- \`compare\` checks"
              echo "id sets and timestamps, never document shape."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reindex for this push." >> "$GITHUB_STEP_SUMMARY"
          fi

  # --- refuse in 30 seconds rather than 3 hours -----------------------------
  #
  # provision_opensearch_cluster.sh refuses an existing `<canonical>-next`, because
  # two rebuilds writing into one cluster interleave into a corrupt index. Without
  # this check that refusal surfaces only after staging has already migrated and
  # promoted -- hours in, with staging ahead of prod.
  preflight-clusters:
    name: Preflight ${{ matrix.environ }}
    needs: detect-reindex
    if: needs.detect-reindex.outputs.reindex_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environ }}
    strategy:
      fail-fast: true
      matrix:
        environ: ["staging", "prod"]
    # Job-level, so it is released when this job ends. See the workflow-level note.
    concurrency:
      group: opensearch-maintenance-${{ matrix.environ }}
      cancel-in-progress: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Refuse if a replacement cluster already exists
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: >
            bash -c 'if cf service datagov-catalog-opensearch-next >/dev/null 2>&1;
            then echo "datagov-catalog-opensearch-next already exists in ${{ matrix.environ }}." >&2;
            echo "A migration is in flight, parked, or failed partway. Finish or delete it" >&2;
            echo "before merging another reindex:" >&2;
            echo "  bin/delete_opensearch_cluster.sh datagov-catalog-opensearch-next datagov-harvest datagov-catalog" >&2;
            exit 1; else echo "No leftover replacement cluster in ${{ matrix.environ }}."; fi'
          cf_org: gsa-datagov
          cf_space: ${{ matrix.environ }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

  # --- staging ---------------------------------------------------------------
  create-cloudgov-services-staging:
    name: create services (staging)
    needs: [detect-reindex, preflight-clusters]
    # preflight-clusters is skipped when no reindex is needed, and a job whose needs
    # were skipped is itself skipped before its `if:` runs -- hence the explicit
    # result check rather than relying on defaults.
    if: >-
      ${{ !cancelled()
      && needs.detect-reindex.result == 'success'
      && contains(fromJson('["success","skipped"]'), needs.preflight-clusters.result) }}
    environment: staging
    runs-on: ubuntu-latest
    # create_cloudgov_services.sh does `cf service <canonical> || cf create-service`.
    # During a promote the canonical name briefly does not exist, so without this
    # group a merge landing in that window would provision a second empty cluster
    # under the canonical name and collide with the rename.
    concurrency:
      group: opensearch-maintenance-staging
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: create services
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: bash create_cloudgov_services.sh
          cf_org: gsa-datagov
          cf_space: staging
          cf_username: ${{secrets.CF_SERVICE_USER}}
          cf_password: ${{secrets.CF_SERVICE_AUTH}}

  deploy-staging:
    name: deploy (staging)
    needs:
      - create-cloudgov-services-staging
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    concurrency:
      group: opensearch-maintenance-staging
      cancel-in-progress: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Deploy via composite action
        uses: ./.github/actions/deploy
        with:
          cf_space: staging
          python-version: ${{ env.PY_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

  # The deploy pushes with `--no-wait`, so the job above finishing does NOT mean the
  # new droplet is running. The reindex runs via `cf run-task`, which uses the app's
  # current droplet -- if that is still the old one, the rebuild writes documents in
  # the OLD shape into the NEW cluster and both verification gates pass anyway,
  # because `compare` cannot see document shape. Gate on the rollout, never on
  # timing.
  await-rollout-staging:
    name: Await rollout (staging)
    needs: [detect-reindex, deploy-staging]
    if: >-
      ${{ !cancelled()
      && needs.deploy-staging.result == 'success'
      && needs.detect-reindex.outputs.reindex_needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: opensearch-maintenance-staging
      cancel-in-progress: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Wait for the rolling deployment to finish
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: bin/wait_for_deployment.sh datagov-harvest 1800
          cf_org: gsa-datagov
          cf_space: staging
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

  # NO job-level `concurrency:` on this job. The workflow it calls takes
  # `opensearch-maintenance-staging` itself; holding the same group here would make
  # the child queue behind its own parent forever.
  reindex-staging:
    name: Reindex (staging)
    needs: [detect-reindex, await-rollout-staging]
    if: >-
      ${{ !cancelled()
      && needs.detect-reindex.outputs.reindex_needed == 'true'
      && needs.await-rollout-staging.result == 'success'
      && !(inputs.dry_run || false) }}
    uses: ./.github/workflows/migrate_opensearch_cluster.yml
    with:
      environment: staging
      start_at: provision
      stop_after: decommission
      next_service_name: datagov-catalog-opensearch-next
      canonical_service_name: datagov-catalog-opensearch
      # Blank matches the live plan for the space; this is a re-map, not a resize.
      next_plan: ""
      keep_old_cluster: false
      # Delete a failed replacement so the next labelled merge is not blocked by
      # provision refusing a leftover instance.
      on_build_failure: delete
      # Unattended, so drain-then-kill rather than waiting 2h and failing.
      force_kill_running_jobs: true
      max_tasks: "3"
      max_failed_records: "50"
    secrets: inherit

  # --- prod ------------------------------------------------------------------
  create-cloudgov-services-prod:
    name: create services (prod)
    needs: [detect-reindex, preflight-clusters]
    if: >-
      ${{ !cancelled()
      && needs.detect-reindex.result == 'success'
      && contains(fromJson('["success","skipped"]'), needs.preflight-clusters.result) }}
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: opensearch-maintenance-prod
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: create services
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: bash create_cloudgov_services.sh
          cf_org: gsa-datagov
          cf_space: prod
          cf_username: ${{secrets.CF_SERVICE_USER}}
          cf_password: ${{secrets.CF_SERVICE_AUTH}}

  deploy-prod:
    name: deploy (prod)
    needs:
      - create-cloudgov-services-prod
      - deploy-staging
      - await-rollout-staging
      - reindex-staging
    # `reindex-staging` and `await-rollout-staging` are skipped on the common
    # unlabelled path, and a job whose needs were skipped is skipped before its `if:`
    # is evaluated -- so both must be listed as acceptable explicitly. `!cancelled()`
    # rather than `always()`: a cancelled pipeline must not go on to deploy prod.
    if: >-
      ${{ !cancelled()
      && needs.create-cloudgov-services-prod.result == 'success'
      && needs.deploy-staging.result == 'success'
      && contains(fromJson('["success","skipped"]'), needs.await-rollout-staging.result)
      && contains(fromJson('["success","skipped"]'), needs.reindex-staging.result) }}
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    concurrency:
      group: opensearch-maintenance-prod
      cancel-in-progress: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Deploy via composite action
        uses: ./.github/actions/deploy
        with:
          cf_space: prod
          python-version: ${{ env.PY_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

  await-rollout-prod:
    name: Await rollout (prod)
    needs: [detect-reindex, deploy-prod]
    if: >-
      ${{ !cancelled()
      && needs.deploy-prod.result == 'success'
      && needs.detect-reindex.outputs.reindex_needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    concurrency:
      group: opensearch-maintenance-prod
      cancel-in-progress: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Wait for the rolling deployment to finish
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: bin/wait_for_deployment.sh datagov-harvest 1800
          cf_org: gsa-datagov
          cf_space: prod
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

  # See reindex-staging: no job-level concurrency here either.
  reindex-prod:
    name: Reindex (prod)
    needs: [detect-reindex, await-rollout-prod]
    if: >-
      ${{ !cancelled()
      && needs.detect-reindex.outputs.reindex_needed == 'true'
      && needs.await-rollout-prod.result == 'success'
      && !(inputs.dry_run || false) }}
    uses: ./.github/workflows/migrate_opensearch_cluster.yml
    with:
      environment: prod
      start_at: provision
      stop_after: decommission
      next_service_name: datagov-catalog-opensearch-next
      canonical_service_name: datagov-catalog-opensearch
      next_plan: ""
      keep_old_cluster: false
      # Keep a failed prod replacement: an es-large provision takes hours, and
      # `explain-resume` prints the `start_at: rebuild` command to resume it.
      on_build_failure: keep
      # NOT force-killed in prod: prod harvest jobs are long, and cancelling them
      # unattended is worse than failing loudly with the live cluster untouched.
      force_kill_running_jobs: false
      max_tasks: "3"
      max_failed_records: "50"
    secrets: inherit

  # --- what the reindex would have done (dry run) ---------------------------
  dry-run-summary:
    name: Dry run (no cluster touched)
    needs: detect-reindex
    if: >-
      ${{ !cancelled()
      && needs.detect-reindex.outputs.reindex_needed == 'true'
      && (inputs.dry_run || false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the inputs that would have been used
        env:
          PRS: ${{ needs.detect-reindex.outputs.pr_numbers }}
          BASE: ${{ needs.detect-reindex.outputs.base_sha }}
        run: |
          {
            echo "### Dry run: a reindex WOULD have run"
            echo
            echo "Detected from \`${BASE}\`, PR(s) \`${PRS}\`."
            echo
            echo '| input | staging | prod |'
            echo '| --- | --- | --- |'
            echo '| start_at | provision | provision |'
            echo '| stop_after | decommission | decommission |'
            echo '| on_build_failure | delete | keep |'
            echo '| force_kill_running_jobs | true | false |'
            echo '| max_failed_records | 50 | 50 |'
          } >> "$GITHUB_STEP_SUMMARY"

  # --- an owed reindex must never be silent ---------------------------------
  #
  # Second layer behind the watermark: if this run decided a reindex was needed and
  # did not finish one, say so somewhere durable. The watermark only advances on a
  # successful run, so the obligation is still detectable -- but an issue makes it
  # visible to a human rather than only to the next run.
  reindex-owed:
    name: Report an owed reindex
    needs: [detect-reindex, reindex-staging, reindex-prod]
    if: >-
      ${{ always()
      && needs.detect-reindex.outputs.reindex_needed == 'true'
      && !(inputs.dry_run || false)
      && (needs.reindex-staging.result != 'success'
      || needs.reindex-prod.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Open or update the tracking issue
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          PR_NUMBERS: ${{ needs.detect-reindex.outputs.pr_numbers }}
          STAGING_RESULT: ${{ needs.reindex-staging.result }}
          PROD_RESULT: ${{ needs.reindex-prod.result }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          LAST_COMMIT: ${{ github.sha }}
        with:
          filename: .github/reindex_owed.md
          update_existing: true

  network-policies:
    name: Add network-policies
    needs:
      - deploy-staging
      - deploy-prod
    # Explicit, for the same skipped-needs reason as deploy-prod.
    if: >-
      ${{ !cancelled()
      && needs.deploy-staging.result == 'success'
      && needs.deploy-prod.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environ }}
    # No maintenance group: add-network-policy does not touch OpenSearch.
    strategy:
      fail-fast: false
      matrix:
        command: [
          "cf add-network-policy datagov-harvest-proxy datagov-harvest --protocol tcp --port 61443",
          "cf add-network-policy datagov-harvest mdtranslator --protocol tcp --port 8080"
        ]
        environ: ["staging", "prod"]
    steps:
      - name: Add network policy
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: ${{ matrix.command }}
          cf_org: gsa-datagov
          cf_space: ${{ matrix.environ }}
          cf_username: ${{secrets.CF_SERVICE_USER}}
          cf_password: ${{secrets.CF_SERVICE_AUTH}}
