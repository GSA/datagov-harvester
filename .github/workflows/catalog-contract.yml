name: Catalog Contract

# Verifies that harvester changes to the Postgres schema or the OpenSearch mapping
# don't break catalog, which reads both and owns neither. Provisions services with
# harvester's migrations and mapping, then runs catalog's test suite against them.
# See GSA/data.gov#6210 and docs/catalog-contract-test.md.
#
# No branch filter: harvester PRs target both main and develop, and DB changes tend
# to land on develop first. No `paths` filter either -- a path-skipped job reports
# "skipped", which cannot satisfy a required status check.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      catalog_image:
        description: Catalog image to test against
        default: ghcr.io/gsa/datagov-catalog:main
        required: false

concurrency:
  group: catalog-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    name: Catalog tests vs harvester schema
    timeout-minutes: 20
    # No `environment:` and no secrets: the catalog image is public and
    # .env.sample supplies everything, so this also runs on fork PRs.
    env:
      CATALOG_IMAGE: ${{ inputs.catalog_image || 'ghcr.io/gsa/datagov-catalog:main' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Create local .env from sample
        run: cp .env.sample .env

      - name: Report the image under test
        run: echo "Catalog image: ${CATALOG_IMAGE}"

      - name: Start Postgres and OpenSearch
        run: make catalog-contract-up

      - name: Apply harvester migrations and OpenSearch mapping
        run: make catalog-contract-provision

      - name: Run catalog tests
        run: make catalog-contract-test

      - name: Dump service logs
        if: failure()
        run: make catalog-contract-logs

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: catalog-contract-report
          path: reports/
          retention-days: 30

      - name: Tear down services
        if: always()
        run: make catalog-contract-down
