name: SCRATCH - Rehearse OpenSearch replacement on staging

# Branch-only bootstrap for the replacement-cluster release workflow.
#
# This file is a dispatch shim and nothing more. It exists because GitHub only
# registers workflow_dispatch for workflow files present on the default branch,
# and release-space.yml is workflow_call-only, so neither it nor
# detect-opensearch-migration.yml can be dispatched from an unmerged branch.
# `uses: ./...` resolves from this file's ref, so the job below runs the
# branch's release-space.yml byte-for-byte as main will run it after merge --
# keep this shim free of any input that release-space.yml does not already
# accept on docs/opensearch-change-deployment.
#
# Not covered here: detect-opensearch-migration.yml (needs a successful release
# run on this branch as its watermark, which a scratch branch never has) and
# deploy.yml's staging->prod sequencing. Those are exercised on develop via
# deploy-development.yml.
#
# This path is already registered on the default branch, so GitHub can dispatch
# this staging-only definition from the test branch:
#
#   gh workflow run rebuild_opensearch_index.yml \
#     --repo GSA/datagov-harvester \
#     --ref test/opensearch-release-staging-20260814 \
#     -f confirm_staging_migration=resume-staging
#
# Pushing this branch only runs normal commit CI. It does not start the rehearsal.

on:
  workflow_dispatch:
    inputs:
      confirm_staging_migration:
        description: "Type resume-staging to run the full staging rehearsal"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  # The called release job owns opensearch-maintenance-staging. Reusing that
  # group here would deadlock the reusable workflow behind its caller.
  group: opensearch-staging-rehearsal-dispatch
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate staging-only guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch and confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_staging_migration }}
          ALLOWED_REF: test/opensearch-release-staging-20260814
        run: |
          if [[ "$CONFIRMATION" != "resume-staging" ]]; then
            echo "Set confirm_staging_migration to resume-staging." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$ALLOWED_REF" ]]; then
            echo "The staging rehearsal is restricted to $ALLOWED_REF." >&2
            exit 1
          fi

  staging-replacement-cluster-rehearsal:
    name: Replacement-cluster rehearsal (staging only)
    needs: validate-inputs
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-space.yml
    with:
      space: staging
      migrate_opensearch: true
      migration_prs: manual pre-merge staging rehearsal from ${{ github.ref_name }}
    secrets: inherit
