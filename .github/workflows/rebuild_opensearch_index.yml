name: Rebuild OpenSearch Index

# Rebuild the OpenSearch `datasets` index from PostgreSQL.
#
#   disable harvester (reuse Toggle Harvester)
#     -> wait for in-flight harvest jobs to drain (optionally force-kill after 15m)
#     -> rebuild-index: recreate `datasets` with the current mapping, backfill from
#        PostgreSQL, validate the document count
#     -> re-enable harvester (always, even if the rebuild failed)
#
# The rebuild is DESTRUCTIVE to the cluster it runs against: it drops `datasets`
# and refills it, so that cluster returns no results until the backfill finishes.
#
# Run it with cluster=next against a freshly provisioned replacement cluster and
# cut over afterwards -- the live cluster is then never touched and keeps serving
# queries at full speed. The cutover is a separate, manual step. cluster=live
# rebuilds in place and takes search down for the duration; use it only when a
# search outage in that space is acceptable.
# See docs/ops/migrate-opensearch-cluster.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloud Foundry environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - prod
      cluster:
        description: "Which cluster to rebuild in ('next' leaves live search untouched; 'live' takes search down)"
        required: true
        default: next
        type: choice
        options:
          - next
          - live
      force_kill_running_jobs:
        description: "Cancel harvest jobs still running after 15 minutes"
        required: true
        default: false
        type: boolean
      max_tasks:
        description: "HARVEST_RUNNER_MAX_TASKS to restore when re-enabling"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: opensearch-maintenance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  disable-harvester:
    name: Disable harvester (${{ inputs.environment }})
    uses: ./.github/workflows/toggle_harvester.yml
    with:
      state: disable
      environment: ${{ inputs.environment }}
    secrets:
      CF_SERVICE_USER: ${{ secrets.CF_SERVICE_USER }}
      CF_SERVICE_AUTH: ${{ secrets.CF_SERVICE_AUTH }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rebuild:
    name: Rebuild OpenSearch index (${{ inputs.environment }}, ${{ inputs.cluster }} cluster)
    needs: disable-harvester
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.environment }}
    env:
      CF_SPACE: ${{ inputs.environment }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set operation names and options
        env:
          CLUSTER: ${{ inputs.cluster }}
        run: |
          echo "REBUILD_TASK=search-rebuild-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "CLUSTER_OPTION=--cluster ${CLUSTER}" >> "$GITHUB_ENV"

      - name: Wait for running harvest tasks
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: >
            bin/wait_for_harvest_tasks.sh datagov-harvest 7200
            ${{ inputs.force_kill_running_jobs && '--force-kill-running-jobs' || '' }}
          cf_org: gsa-datagov
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

      - name: Start index rebuild
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: >
            cf run-task datagov-harvest --name "$REBUILD_TASK" -k 4G -m 2G
            --command "flask search rebuild-index $CLUSTER_OPTION"
          cf_org: gsa-datagov
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

      - name: Monitor index rebuild
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: bin/monitor_cf_logs.sh datagov-harvest "$REBUILD_TASK"
          cf_org: gsa-datagov
          cf_space: ${{ env.CF_SPACE }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

  enable-harvester:
    name: Re-enable harvester (${{ inputs.environment }})
    needs: rebuild
    # Always re-enable, even if the rebuild failed, so harvesting resumes.
    if: always()
    uses: ./.github/workflows/toggle_harvester.yml
    with:
      state: enable
      max_tasks: ${{ inputs.max_tasks }}
      environment: ${{ inputs.environment }}
    secrets:
      CF_SERVICE_USER: ${{ secrets.CF_SERVICE_USER }}
      CF_SERVICE_AUTH: ${{ secrets.CF_SERVICE_AUTH }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
