name: Cutover OpenSearch Cluster

# Point datagov-harvest and datagov-catalog at a given OpenSearch service
# instance, in one auditable step.
#
#   cf set-env <app> OPENSEARCH_SERVICE_NAME <instance>
#     -> cf restart <app> --strategy rolling   (blocking, no --no-wait)
#
# Both apps live in the same space and use the same deployer credentials, so one
# workflow can move both even though catalog lives in another repo. The apps are
# processed in the order listed: harvester first by default, so that when
# harvesting resumes no write goes to the cluster being left behind.
#
# This is also the ROLLBACK tool -- re-run it with the previous instance name.
# And the last step of a decommission, when the new cluster has been renamed to
# the canonical name.
#
# Nothing here touches indexes. Both apps read the `datasets` index, and index
# names are scoped to a cluster, so there is no index name to coordinate. See
# docs/ops/migrate-opensearch-cluster.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloud Foundry environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - prod
      service_name:
        description: "OpenSearch service instance to point at (e.g. datagov-catalog-opensearch-next)"
        required: true
        type: string
      apps:
        description: "Space-separated apps to move, in order"
        required: true
        default: datagov-harvest datagov-catalog
        type: string

permissions:
  contents: read

concurrency:
  group: opensearch-maintenance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  cutover:
    name: Point apps at ${{ inputs.service_name }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Validate inputs
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          APPS: ${{ inputs.apps }}
        run: |
          # These end up in a cf command line, so constrain them to CF-legal
          # names rather than trusting free-text workflow input.
          #
          # Reject the WHOLE apps string against a single-space-separated pattern
          # before splitting it. Validating token-by-token after word splitting
          # would accept embedded newlines and globs, leaving safety dependent on
          # how the downstream action happens to expand the command string.
          if [[ ! "$SERVICE_NAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Service name must match [a-zA-Z0-9._-]+ (got: '$SERVICE_NAME')."
            exit 1
          fi
          if [[ ! "$APPS" =~ ^[a-zA-Z0-9._-]+( [a-zA-Z0-9._-]+)*$ ]]; then
            echo "::error::Apps must be space-separated names matching [a-zA-Z0-9._-]+ (got: '$APPS')."
            exit 1
          fi

      - name: Point apps at the cluster and roll them
        uses: cloud-gov/cg-cli-tools@main
        with:
          command: >
            bin/cutover_opensearch_cluster.sh "${{ inputs.service_name }}"
            ${{ inputs.apps }}
          cf_org: gsa-datagov
          cf_space: ${{ inputs.environment }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

      - name: Report resolved cluster per app
        uses: cloud-gov/cg-cli-tools@main
        with:
          # `cf env` shows OPENSEARCH_SERVICE_NAME (a set-env var) but NOT
          # OPENSEARCH_HOST, which .profile exports inside the container. Read
          # the resolved host from the app itself so the log records which
          # cluster each app is actually talking to.
          command: >
            bin/report_opensearch_cluster.sh ${{ inputs.apps }}
          cf_org: gsa-datagov
          cf_space: ${{ inputs.environment }}
          cf_username: ${{ secrets.CF_SERVICE_USER }}
          cf_password: ${{ secrets.CF_SERVICE_AUTH }}

      - name: Build notification text
        if: always()
        # Interpolate through env, not straight into the JSON payload below: this
        # step runs even when validation failed, so `apps`/`service_name` may
        # still hold arbitrary text. A quote in a payload template would break
        # the JSON or inject sibling fields.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
          APPS: ${{ inputs.apps }}
          SERVICE_NAME: ${{ inputs.service_name }}
          STATUS: ${{ job.status }}
        run: |
          summary="OpenSearch cutover in the ${ENVIRONMENT} space by ${ACTOR}: ${APPS} now pointed at ${SERVICE_NAME} (${STATUS})."
          # jq -Rs emits a correctly escaped JSON string for any input.
          printf 'text=%s\n' "$(printf '%s' "$summary" | jq -Rs .)" >> "$GITHUB_OUTPUT"
        id: notification

      - name: Send notification to Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ steps.notification.outputs.text }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
