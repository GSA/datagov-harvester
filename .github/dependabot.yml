# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app/static"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/plugin-transform-runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
    groups:
      npm-packages:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-packages:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Ignore minor and patch updates
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # Group all updates together
      github-actions:
        patterns:
          - "*"
  # Bumps the _external/dcat-us gitlink to the tip of the branch named in
  # .gitmodules (GSA/dcat-us main). These are the DCAT-US 3.0 JSON Schemas the
  # harvester validates records against, so a stale pin means we accept and
  # reject records against something other than the published spec.
  #
  # Monthly, not weekly: one continuously-rebased PR is the right cadence for a
  # schema spec. Expect the first PR's CI to fail — the pin is well behind
  # GSA/dcat-us main, and definition changes legitimately change which records
  # validate. That is what the pin is for. See "Upgrading to a newer dcat-us" in
  # docs/developer.md; fix or reject the bump, never skip the tests.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
