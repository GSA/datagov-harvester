---
applications:
  - name: ((app_name))-proxy
    buildpacks:
      - https://github.com/cloudfoundry/nginx-buildpack
    services:
      - ((app_name))-secrets
      - logstack-space-drain
    path: ./proxy
    memory: 100M
    instances: ((proxy_instances))
    routes:
      - route: ((route_external))
    env:
      EXTERNAL_ROUTE: ((route_external))
      INTERNAL_ROUTE: ((route_internal))
      BASIC_AUTH_ENABLED: ((basic_auth_enabled))

  - name: ((app_name))
    buildpacks:
      - python_buildpack
    routes:
      - route: ((route_internal))
    services:
      # The OpenSearch cluster is shared with catalog, hence the catalog name.
      # A replacement cluster used during a migration is deliberately NOT listed
      # here: a manifest cannot reference a service instance that does not exist,
      # so listing it would break deploys in every space that has not been
      # provisioned yet. Manifest application is additive and does not remove
      # existing bindings, so `cf bind-service` survives deploys on its own.
      # See docs/ops/migrate-opensearch-cluster.md.
      - ((app_name))-db
      - ((app_name))-secrets
      - datagov-catalog-opensearch
      - ((app_name))-smtp
      - logstack-space-drain
    instances: ((admin_instances))
    memory: ((admin_memory_quota))
    disk_quota: ((admin_disk_quota))
    env:
      FLASK_APP: run.py
      EXTERNAL_ROUTE: ((route_external))
      CF_API_URL: ((CF_API_URL))
      CATALOG_BASE_URL: ((CATALOG_BASE_URL))
      HARVEST_RETRY_ON_ERROR: ((HARVEST_RETRY_ON_ERROR))
      MDTRANSLATOR_URL: ((MDTRANSLATOR_URL))
      CLIENT_ID: ((CLIENT_ID))
      ISSUER: ((ISSUER))
      REDIRECT_URI: ((REDIRECT_URI))
      NEW_RELIC_APP_NAME: ((app_name))-((space_name))
      NEW_RELIC_HOST: gov-collector.newrelic.com
      NEW_RELIC_MONITOR_MODE: ((new_relic_monitor_mode))
      NEW_RELIC_CONFIG_FILE: /home/vcap/app/config/newrelic.ini
      ASSET_VERSION: ((asset_version))
    command: ./app-start.sh
