---
applications:
  - name: ((app_name))-proxy
    buildpacks:
      - https://github.com/cloudfoundry/nginx-buildpack
    services:
      - ((harvest_service_name))-secrets
      - logstack-space-drain
    path: ./proxy
    memory: 100M
    instances: ((proxy_instances))
    routes:
      - route: ((route_external))
    env:
      EXTERNAL_ROUTE: ((route_external))
      INTERNAL_ROUTE: ((route_internal))
      VALIDATOR_INTERNAL_ROUTE: ((route_internal_validator))
      BASIC_AUTH_ENABLED: ((basic_auth_enabled))

  - &harvest_app
    name: ((app_name))
    buildpacks:
      - python_buildpack
    routes:
      - route: ((route_internal))
    services:
      - ((harvest_service_name))-db
      - ((harvest_service_name))-secrets
      - ((opensearch_service_name))
      - ((harvest_service_name))-smtp
      - logstack-space-drain
    instances: ((admin_instances))
    memory: ((admin_memory_quota))
    disk_quota: ((admin_disk_quota))
    env:
      FLASK_APP: run.py
      HARVEST_SERVICE_NAME: ((harvest_service_name))
      OPENSEARCH_SERVICE_NAME: ((opensearch_service_name))
      EXTERNAL_ROUTE: ((route_external))
      CF_API_URL: ((CF_API_URL))
      CATALOG_BASE_URL: ((CATALOG_BASE_URL))
      HARVEST_RETRY_ON_ERROR: ((HARVEST_RETRY_ON_ERROR))
      MDTRANSLATOR_URL: ((MDTRANSLATOR_URL))
      CLIENT_ID: ((CLIENT_ID))
      ISSUER: ((ISSUER))
      REDIRECT_URI: ((REDIRECT_URI))
      NEW_RELIC_APP_NAME: ((app_name))-((space_name))
      NEW_RELIC_HOST: gov-collector.newrelic.com
      NEW_RELIC_MONITOR_MODE: ((new_relic_monitor_mode))
      NEW_RELIC_CONFIG_FILE: /home/vcap/app/config/newrelic.ini
      NEW_RELIC_MONITOR_DB_ACTIVITY: ((new_relic_monitor_db_activity))
      ASSET_VERSION: ((asset_version))
    command: ./app-start.sh

  - <<: *harvest_app
    name: ((app_name))-next
    routes: []
    instances: 0
    services:
      - ((harvest_service_name))-db
      - ((harvest_service_name))-secrets
      - ((opensearch_service_name))
      - logstack-space-drain

  # Serves the public /validate, /validate/, /api/validate, and /api/v1/validate
  # routes (proxied here by datagov-harvest-proxy) in isolation from the admin
  # app, so validator load and its server-side URL fetching can't affect
  # harvester administration (GSA/data.gov#6293). Runs the same codebase as
  # ((app_name)) - the routes stay live there too as a rollback path - but
  # skips migrations (SKIP_DB_MIGRATIONS) and binds its own scoped -db/-secrets
  # (see below) rather than the admin app's, and never binds OpenSearch or
  # SMTP, since the validator doesn't use any of those.
  - name: ((app_name))-validator
    buildpacks:
      - python_buildpack
    routes:
      - route: ((route_internal_validator))
    services:
      # Deliberately not ((harvest_service_name))-db/-secrets: those hold the
      # real admin database and the admin app's full secret set (including
      # HARVEST_API_TOKEN and the CF deployer credentials), so a compromised
      # validator would inherit far more privilege than it needs. .profile
      # derives the service names it looks up from HARVEST_SERVICE_NAME,
      # defaulting to the app's own CF name when unset - left unset here on
      # purpose so it resolves to ((app_name))-validator and picks up the
      # services below instead. -validator-db is a fake, non-resolving URI:
      # harvester/__init__.py builds a SQLAlchemy engine at import time
      # regardless (it never connects at construction), but nothing on the
      # validator's routes ever queries it. -validator-secrets holds its own
      # throwaway FLASK_APP_SECRET_KEY/HARVEST_API_TOKEN (checked for
      # non-empty at boot, never compared against anything the validator
      # serves) plus the real CF_SERVICE_USER/CF_SERVICE_AUTH/
      # NEW_RELIC_LICENSE_KEY, which do have to be real: LoadManager
      # authenticates to the CF API with them at import time. See
      # docs/developer.md for how to provision both.
      - ((app_name))-validator-db
      - ((app_name))-validator-secrets
      - logstack-space-drain
    instances: ((validator_instances))
    memory: ((validator_memory_quota))
    disk_quota: ((validator_disk_quota))
    env:
      FLASK_APP: run.py
      EXTERNAL_ROUTE: ((route_external))
      CF_API_URL: ((CF_API_URL))
      # Not used by the validator's routes, but required at import time:
      # app/main/auth.py builds AUTH_URL/TOKEN_URL from ISSUER unconditionally,
      # and harvester/utils/general_utils.py's SMTP_CONFIG does the same with
      # REDIRECT_URI - both modules load during create_app() regardless of app.
      CLIENT_ID: ((CLIENT_ID))
      ISSUER: ((ISSUER))
      REDIRECT_URI: ((REDIRECT_URI))
      SKIP_DB_MIGRATIONS: true
      NEW_RELIC_APP_NAME: ((app_name))-validator-((space_name))
      NEW_RELIC_HOST: gov-collector.newrelic.com
      NEW_RELIC_MONITOR_MODE: ((new_relic_monitor_mode))
      NEW_RELIC_CONFIG_FILE: /home/vcap/app/config/newrelic.ini
      ASSET_VERSION: ((asset_version))
    command: ./app-start.sh
