# Catalog contract test (GSA/data.gov#6210).
#
# Harvester owns the Postgres schema (migrations/), the OpenSearch index mapping
# (search/mappings.py), and the document shape (search/documents.py). Catalog reads
# all three and owns none of them, so a harvester change can break catalog without
# any harvester test noticing.
#
# This stack provisions services with *harvester's* migrations and mapping, then runs
# *catalog's* test suite -- catalog's own code, exactly as it ships -- against them.
# The question it answers is "will this harvester change break catalog?", nothing more.
# See `make test-catalog-contract` and docs/catalog-contract-test.md.
#
# No host ports are published: every step runs inside this compose network, so
# the stack can't collide with `make up` (which already occupies 5432, 5433 and
# 9200) and doesn't care that the OpenSearch port is hardcoded to 9200 client-side.
services:
  db:
    # Deliberately harvester's PostGIS version, not catalog's (15-3.4): the point
    # is to test the stack harvester ships. PostGIS (not plain postgres) is
    # required -- the base migration does CREATE EXTENSION postgis.
    platform: linux/amd64
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    # Do not bump to >= 2.12: it requires OPENSEARCH_INITIAL_ADMIN_PASSWORD, and
    # datagov_data_access hardcodes admin:admin over https on port 9200.
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
    healthcheck:
      test: ['CMD-SHELL', 'curl -sk -u admin:admin https://localhost:9200/_cluster/health?wait_for_status=yellow\&timeout=1s | grep -q ''"timed_out":false''']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: applies harvester's migrations and resets the OpenSearch mapping,
  # then seeds Postgres and indexes those rows with harvester's *own* writer.
  # Must complete before the read stages start -- catalog's create_app() connects
  # to OpenSearch at import and will create the index with *its* mapping if the
  # index is missing, which would quietly defeat the whole test.
  provision:
    build: .
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql+psycopg://myuser:mypassword@db:5432/mydb
      OPENSEARCH_HOST: opensearch
      FLASK_APP: run.py
      # Required by app/startup_validation.py; values are irrelevant here.
      FLASK_APP_SECRET_KEY: catalog-contract-secret
      HARVEST_API_TOKEN: catalog-contract-token
    command:
      - /bin/sh
      - -c
      - |
        set -e
        flask db upgrade
        flask search reset-mapping
        # Seed Postgres, then index those rows through harvester's real
        # OpenSearchWriter / DatasetDocument. This is what makes the
        # document-shape check below a genuine cross-repo test: harvester
        # writes the documents with its production code, catalog reads them
        # with its production code, and neither side is substituted.
        flask testdata load_test_data
        flask search compare --update

  # Document-shape contract. Runs BEFORE catalog-tests, because catalog's own
  # `interface` fixture calls delete_by_query(match_all) on the index around every
  # test, which would destroy the documents harvester's writer just produced.
  #
  # Reads the harvester-written documents through catalog's real search stack --
  # catalog's SearchCriteria, reader, and routes, none of them substituted. If
  # harvester renames or drops a field in documents.py that catalog reads, this
  # fails; if harvester adds one, it passes. That is the discrimination the old
  # file-overlay could not make.
  catalog-document-shape:
    platform: linux/amd64
    image: ${CATALOG_IMAGE:-ghcr.io/gsa/datagov-catalog:main}
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    working_dir: /app
    environment:
      DATABASE_URI: postgresql+psycopg://myuser:mypassword@db:5432/mydb
      OPENSEARCH_HOST: opensearch
      FLASK_SECRET_KEY: catalog-contract-secret
      CATALOG_BASE_URL: http://0.0.0.0:8080
    volumes:
      - ./tests/contract/test_document_shape.py:/app/tests/contract/test_document_shape.py:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        pytest tests/contract/test_document_shape.py -v -p no:cacheprovider

  catalog-tests:
    # Catalog publishes amd64 only; without this the stack won't start on an
    # Apple Silicon machine ("no image found in image index for architecture
    # arm64"). CI runners are amd64, so this only matters locally.
    platform: linux/amd64
    image: ${CATALOG_IMAGE:-ghcr.io/gsa/datagov-catalog:main}
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    working_dir: /app
    environment:
      DATABASE_URI: postgresql+psycopg://myuser:mypassword@db:5432/mydb
      OPENSEARCH_HOST: opensearch
      # Catalog's env var name, not harvester's FLASK_APP_SECRET_KEY.
      FLASK_SECRET_KEY: catalog-contract-secret
      # Must be 0.0.0.0 (catalog's .env.sample): tests/unit/test_routes.py
      # asserts the indexed harvest_record URL starts with http://0.0.0.0:8080/.
      CATALOG_BASE_URL: http://0.0.0.0:8080
      # Tells catalog's dbapp fixture to TRUNCATE rather than drop_all/create_all,
      # preserving the schema harvester's migrations just built.
      CATALOG_TEST_EXTERNAL_SCHEMA: "true"
      # Index through *harvester's* OpenSearchWriter instead of catalog's vendored
      # copy, so catalog's full fixture set (DCAT-US 3.0, isPartOf collections,
      # spatial bboxes, stopword titles) is written by harvester's real production
      # write path and read back by catalog's real read path. Without this,
      # catalog writes and reads with its own copy of the writer -- a closed loop
      # that cannot notice a harvester-side change to DatasetDocument or the
      # writer. Consumed by catalog's tests/writer_provider.py.
      HARVESTER_SEARCH_PATH: /harvester/search
    volumes:
      - ./reports:/app/reports
      # Harvester's search package, mounted under its own namespace. This is NOT
      # the file overlay that was removed from this job: nothing in app/search/ is
      # clobbered, no filename parity between the repos is required, and harvester
      # adding a module catalog lacks is a non-event. Only the writer is swapped;
      # catalog's reader, models, routes and templates stay catalog's.
      - ./search:/harvester/search:ro
      - ./shared:/harvester/shared:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        pytest tests/unit -v --junitxml=/app/reports/catalog-contract.xml
