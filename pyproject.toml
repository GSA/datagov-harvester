[tool.poetry]
name = "datagov-harvester"
version = "0.5.0"
description = ""
authors = ["Datagov Team <datagov@gsa.gov>"]
maintainers = ["Datagov Team <datagov@gsa.gov>"]
readme = "README.md"
packages = [{ include = "harvester" }]
license = "LICENSE.md"                                  # TODO fix me
repository = "https://github.com/GSA/datagov-harvester"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = "3.12.13" # stay with 3.12 until *.apps.internal:61443 works for 3.13
jsonschema = {extras = ["format"], version = "^4.26.0"}
python-dotenv = ">=1"
deepdiff = ">=8.6.1"
ckanapi = ">=4.7"
beautifulsoup4 = "^4.14.3"
sqlalchemy = "^2.0.51"
flask = "^3.1.3"
click = "8.4.2"
flask-sqlalchemy = "^3.1.1"
flask-wtf = "^1.2.1"
flask-migrate = "^4.0.7"
cloudfoundry-client = "^1.40.0"
pyjwt = ">=2.13.0,<3.0.0"
cryptography = ">=50.0.0,<51.0.0"
boltons = ">=25,<27"
jinja2-fragments = "^1.12.0"
flask-htmx = "^0.4.0"
gunicorn = ">=25.3,<27.0"
gevent = "^26.4.0"
geojson-validator = ">=0.6,<0.8"
GeoAlchemy2 = ">=0.20.0,<0.21"
shapely = ">=2.1.2,<3.0"
protobuf = "^6.33.0"
botocore = ">=1.43.40,<2.0.0"
opensearch-py = ">=3.2.0,<4.0.0"
psycopg = {extras = ["binary"], version = "^3.3.4"}
haversine = ">=2.9.0,<3.0.0"
aiohttp = "^3.14.0" #SNYK-PYTHON-AIOHTTP-17146576
urllib3 = ">=2.5.0" #SNYK-PYTHON-URLLIB3-10390193, SNYK-PYTHON-URLLIB3-10390194
alembic-postgresql-enum = "^1.9.0"
google-auth = "^2.49.2"
google-api-python-client = "^2.194.0"
pyasn1 = "^0.6.3" #SNYK-PYTHON-PYASN1-15032639
werkzeug = "^3.1.8" #SNYK-PYTHON-WERKZEUG-14908843
apiflask = "^3.1.0"
flask-talisman = "^1.1.0"
newrelic = ">=12.1,<14.0"
idna = ">=3.15,<4.0"
mako = ">=1.3.12,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
ruff = ">=0.15.10,<0.17.0"
pytest-cov = "^7.1.0"
debugpy = "^1.8.20"
isort = "^8.0.1"
black = "^26.3.1"
pre-commit = "^4.5.1"
freezegun = "^1.5.5"
pytest-local-badge = "^1.0.3"
pytest-playwright = ">=0.7.1,<0.10.0"
pytest-flask = "^1.3.0"
playwright = "^1.58.0"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    "_external",
]

# Same as Black.
line-length = 88

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# _external holds the GSA/dcat-us submodule, which ships 10 .py files including
# a test_json_schema.py. Nothing in it is collectable today (it's a CLI script,
# no test_* functions), but Dependabot bumps this submodule monthly and we don't
# want a future dcat-us commit silently adding tests to our suite.
# norecursedirs REPLACES pytest's defaults rather than extending them, so the
# stock entries are restated here.
norecursedirs = [
    "_external",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
skip = [".poetry", "app/static/node_modules", ".venv", "_external"]

[tool.black]
extend-exclude = '^/_external/'
